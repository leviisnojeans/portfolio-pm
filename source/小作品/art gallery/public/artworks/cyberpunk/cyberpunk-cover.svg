<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/><stop offset="0.55" stop-color="#0a0a12"/><stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#05D9E8" stop-opacity="0.9"/><stop offset="1" stop-color="#05D9E8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF2A6D" stop-opacity="0.9"/><stop offset="1" stop-color="#FF2A6D" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="3" fill="#000" opacity="0.18"/></pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <!-- 霓虹光晕 -->
  <circle cx="250" cy="430" r="240" fill="url(#glowM)"/>
  <circle cx="600" cy="640" r="220" fill="url(#glowC)"/>
  <!-- 垂直都市剪影 -->
  <g fill="#0c0c18">
    <rect x="60" y="560" width="110" height="440"/><rect x="190" y="470" width="90" height="530"/>
    <rect x="300" y="620" width="80" height="380"/><rect x="400" y="420" width="120" height="580"/>
    <rect x="540" y="540" width="95" height="460"/><rect x="650" y="480" width="100" height="520"/>
  </g>
  <!-- 窗光 -->
  <g fill="#05D9E8" opacity="0.85"><rect x="210" y="500" width="10" height="14"/><rect x="240" y="540" width="10" height="14"/><rect x="430" y="460" width="10" height="14"/><rect x="470" y="520" width="10" height="14"/><rect x="680" y="520" width="10" height="14"/></g>
  <g fill="#FF2A6D" opacity="0.85"><rect x="90" y="600" width="10" height="14"/><rect x="330" y="660" width="10" height="14"/><rect x="570" y="580" width="10" height="14"/></g>
  <!-- 霓虹招牌 -->
  <rect x="600" y="300" width="22" height="260" fill="#7A04EB" opacity="0.85"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#05D9E8" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#FF2A6D" stroke-width="2" opacity="0.6"/>
  <!-- 扫描线 -->
  <rect width="800" height="1000" fill="url(#scan)"/>
</svg>
