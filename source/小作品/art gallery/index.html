<style>
  :root{
    --paper:#F5F2EC; --ink:#2A2622; --muted:#8A8278; --gold:#B08D4F;
    --line: rgba(42,38,34,.12);
  }
  html.theme-dark{
    --paper:#0E0E12; --ink:#ECE7DE; --muted:#9a958c; --gold:#C9A24B;
    --line: rgba(236,231,222,.14);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:"Inter", system-ui, -apple-system, "PingFang SC", sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    transition: color .6s ease;
  }
  .font-serif-display{ font-family:"Playfair Display", Georgia, "Songti SC", serif; }
  .font-serif-zh{ font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC", Georgia, serif; }

  /* ── Ambient background ── */
  #ambient{
    position:fixed; inset:0; z-index:-1;
    background: var(--paper);
    transition: background .6s ease;
  }

  /* ── Top nav ── */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,56px);
    background:transparent;
    transition:background .35s ease, border-color .35s ease;
    border-bottom:1px solid transparent;
  }
  .nav a{ color:var(--ink); text-decoration:none; transition:color .35s ease, opacity .2s; }
  /* 详情页 hero 之上：导航文字转白 + 顶部渐变 scrim 保证可读 */
  body.on-detail .nav{ background:linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0)); }
  body.on-detail .nav a{ color:#fff; }
  /* 滚过 hero 后：导航转 paper 底 + 深色字 */
  .nav.nav-solid{ background:var(--paper); border-bottom-color:var(--line); }
  body.on-detail .nav.nav-solid{ background:var(--paper); }
  body.on-detail .nav.nav-solid a{ color:var(--ink); }
  .nav .brand{ font-family:"Playfair Display",serif; font-size:19px; letter-spacing:.06em; }
  .nav .menu{ display:flex; gap:clamp(14px,2.4vw,30px); font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  .nav .menu a{ opacity:.62; }
  .nav .menu a:hover{ opacity:1; }
  .nav .menu a.soon{ cursor:default; }
  @media (max-width:640px){ .nav .menu a.hide-sm{ display:none; } }

  /* ── Carousel ── */
  .stage{
    height:100vh; width:100%;
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    perspective:1600px;
    touch-action:pan-y;
  }
  .track{
    position:absolute; left:50%; top:50%;
    transform-style:preserve-3d;
    width:0; height:0;
  }
  .card{
    position:absolute; left:0; top:0;
    width:min(340px,72vw); height:min(456px,64vh);
    margin-left:calc(min(340px,72vw) / -2);
    margin-top:calc(min(456px,64vh) / -2);
    transform-style:preserve-3d;
    will-change:transform,opacity;
    cursor:pointer;
    user-select:none;
  }
  .card-inner{
    position:absolute; inset:0;
    border-radius:4px; overflow:hidden;
    background:#ccc;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.45), 0 8px 18px -8px rgba(0,0,0,.3);
  }
  .card-art{ position:absolute; inset:0; }
  .card-art img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .card-ph{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:8px;
  }
  .card-ph .ph-zh{ font-family:"Songti SC",serif; font-size:30px; letter-spacing:.08em; }
  .card-ph .ph-en{ font-family:"Playfair Display",serif; font-size:14px; letter-spacing:.22em; text-transform:uppercase; opacity:.7; }
  .card-ph .ph-tag{ margin-top:14px; font-size:10px; letter-spacing:.18em; opacity:.45; text-transform:uppercase; }
  .card-shade{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.15) 42%, rgba(0,0,0,0) 70%);
    opacity:0; transition:opacity .4s ease;
  }
  .card-info{
    position:absolute; left:0; right:0; bottom:0;
    padding:28px 26px;
    color:#fff; text-align:left;
    opacity:0; transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
  }
  .card-info .ci-zh{ font-family:"Songti SC",serif; font-size:26px; letter-spacing:.06em; line-height:1.1; }
  .card-info .ci-en{ font-family:"Playfair Display",serif; font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.78; margin-top:4px; }
  .card-info .ci-meta{ font-size:11px; letter-spacing:.12em; opacity:.7; margin-top:10px; }
  .card-info .ci-core{ font-size:13px; line-height:1.5; opacity:.92; margin-top:10px; max-width:30ch; }
  .card-info .ci-learn{
    display:inline-block; margin-top:16px; font-size:11px; letter-spacing:.22em;
    color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.6);
    padding-bottom:2px; pointer-events:auto;
  }
  /* center card hover (desktop) or auto-focus (touch) reveals info + zoom/darken */
  .card.is-center .card-inner{ transition:transform .45s ease; }
  .card.is-center:hover .card-shade,
  .stage.touch .card.is-center .card-shade{ opacity:1; }
  .card.is-center:hover .card-info,
  .stage.touch .card.is-center .card-info{ opacity:1; transform:translateY(0); }
  .card.is-center:hover .card-inner{ transform:scale(1.03); }

  /* ── progress dots + hint ── */
  .dots{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
    z-index:40; display:flex; gap:9px; align-items:center;
  }
  .dots button{
    width:7px; height:7px; border-radius:99px; border:none; padding:0;
    background:var(--ink); opacity:.22; cursor:pointer; transition:opacity .3s, width .3s;
  }
  .dots button.on{ opacity:.9; width:22px; }
  .hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    z-index:40; font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--muted); opacity:.7;
  }
  .stage-caption{
    position:fixed; left:50%; top:14%; transform:translateX(-50%);
    z-index:30; text-align:center; pointer-events:none;
    opacity:.9; transition:opacity .4s ease;
  }
  .stage-caption .sc-kicker{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); }
  .stage-caption .sc-title{ font-family:"Playfair Display",serif; font-size:clamp(20px,3vw,30px); margin-top:6px; color:var(--ink); }

  /* ── Detail page ── */
  .detail-hero{
    position:relative; min-height:88vh; display:flex; align-items:flex-end;
    overflow:hidden;
  }
  .detail-hero .hero-bg{ position:absolute; inset:0; }
  .detail-hero .hero-bg img{ width:100%; height:100%; object-fit:cover; }
  .detail-hero .hero-shade{ position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.1) 100%); }
  .section{ max-width:1080px; margin:0 auto; padding:clamp(56px,9vw,110px) clamp(20px,5vw,40px); }
  .section + .section{ border-top:1px solid var(--line); }
  .eyebrow{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; }
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:none; }

  a.chip{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:99px;
    padding:9px 16px; font-size:13px; color:var(--ink); text-decoration:none;
    transition:border-color .25s, background .25s;
  }
  a.chip:hover{ border-color:var(--gold); }
  .dna{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); border-radius:6px; padding:16px 18px;
  }
  .dna i{ font-size:24px; color:var(--gold); }

  /* 焦点可见（键盘可达性） */
  .card:focus-visible{ outline:none; }
  .card:focus-visible .card-inner{ box-shadow:0 0 0 3px var(--gold), 0 30px 60px -20px rgba(0,0,0,.45); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  /* 加载 / 错误态 */
  .boot{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:60; color:var(--muted);
  }
  .boot .spin{ width:34px; height:34px; border-radius:99px;
    border:2px solid var(--line); border-top-color:var(--gold); animation:spin .8s linear infinite; }
  .boot .boot-title{ font-family:"Playfair Display",serif; font-size:15px; letter-spacing:.22em; text-transform:uppercase; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* 尊重 prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1 !important; transform:none !important; transition:none !important; }
    .card-inner, .card-info, .card-shade, #ambient, .nav, .stage-caption{ transition:none !important; }
    .boot .spin{ animation:none; }
  }
</style>

<script>
/* ============ 数据层 ============
   单一数据源 = data/styles.json（由图片审计任务持续维护）。
   优先运行时 fetch（部署/服务器上总是最新）；
   fetch 失败时（如 file:// 双击打开）回退到内联快照。            */
let DATA, ALL, byId, STYLES, GALLERY;
const indexOf = id => STYLES.findIndex(s => s.id === id);
const lum = hex => { const h=(hex||'#888888').replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 0.299*r+0.587*g+0.114*b; };

function initData(raw){
  DATA = raw;
  ALL = DATA.styles;
  byId = Object.fromEntries(ALL.map(s => [s.id, s]));
  // getPublishedStyles: 过滤 published + 按 period.start 升序（供 Timeline / 详情页上下篇）
  STYLES = ALL.filter(s => s.status === 'published').sort((a,b) => a.period.start - b.period.start);
  // 画廊滚筒：按 themeColor 亮度从浅到深排序（契合 PRD 环境光 暖→冷→暗）
  GALLERY = [...STYLES].sort((a,b) => lum(b.themeColor) - lum(a.themeColor));
}

async function loadData(){
  try{
    const res = await fetch('data/styles.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }catch(e){
    console.info('[museum] fetch data/styles.json 失败，回退内联快照：', e.message);
    return JSON.parse(document.getElementById('styles-data').textContent);
  }
}

const getCoverImage = s => (s.coverArtwork && s.coverArtwork.image) ? s.coverArtwork.image : null;
const getRelated = s => (s.relatedStyles || []).map(id => byId[id]).filter(Boolean);
const hasEast = s => {
  const e = s.eastWest && s.eastWest.east;
  return !!e && !e.trim().startsWith('TODO');
};
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function isLight(hex){
  if(!hex) return true;
  const h = hex.replace('#',''); if(h.length < 6) return true;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150;
}

/* ============ Ambient ============ */
const ambient = document.getElementById('ambient');
function setAmbient(color, dark){
  const c = color || 'var(--paper)';
  ambient.style.background =
    `radial-gradient(circle at 50% 28%, color-mix(in srgb, ${c} 62%, ${dark?'#000':'#fff'}), ${c})`;
  document.documentElement.classList.toggle('theme-dark', !!dark);
}

/* ============ Router ============ */
const app = document.getElementById('app');
function route(){
  const raw = location.hash.replace(/^#\/?/, '').trim();
  const seg = raw.split('/');
  if(seg[0] === 'timeline'){ renderTimeline(); }
  else if(seg[0] === 'compare'){ renderCompare(seg[1], seg[2]); }
  else if(raw && byId[raw] && byId[raw].status === 'published'){ renderDetail(byId[raw]); }
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ============ Nav ============ */
function navHTML(active){
  const item = (href,label,key) =>
    `<a href="${href}"${active===key?' style="opacity:1;color:var(--gold)"':''}>${label}</a>`;
  return `
  <nav class="nav">
    <a href="#/" class="brand">Museum of Design Languages</a>
    <div class="menu">
      ${item('#/','Gallery','gallery')}
      ${item('#/timeline','Timeline','timeline')}
      ${item('#/compare','Compare','compare')}
      <a href="ai-guide.html">AI 导览</a>
      <a href="#/" class="soon hide-sm" onclick="toast('关于这座博物馆');return false;">About</a>
    </div>
  </nav>`;
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;letter-spacing:.05em;opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.opacity='0', 1600);
}

/* ============ 时间线全景（PRD 3.4） ============ */
const ORDER_ENUM = ['建构秩序','自然秩序','嘲讽秩序','暴露秩序','崩溃秩序'];
function tlThumb(s){
  const img = getCoverImage(s);
  if(img) return `<img src="${esc(img)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover" onerror="this.style.opacity=0">`;
  return `<div style="width:100%;height:100%;background:${phBG(s)}"></div>`;
}
function tlNode(s){
  return `<a href="#/${s.id}" class="tl-node" title="${esc(s.nameZh)}"
      style="flex:0 0 132px;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);position:relative;z-index:2">
      <div style="width:88px;height:88px;border-radius:6px;overflow:hidden;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)">${tlThumb(s)}</div>
      <div style="width:11px;height:11px;border-radius:99px;background:var(--gold);margin:16px 0 0;outline:4px solid var(--paper)"></div>
      <div class="font-serif-zh" style="font-size:14px;margin-top:12px;text-align:center">${esc(s.nameZh)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(s.period.label)}</div>
    </a>`;
}
function renderTimeline(){
  document.body.classList.remove('on-detail');
  document.title = '时间线全景 · 设计语言博物馆';
  setAmbient(null, false);
  app.innerHTML = navHTML('timeline') + `
    <div class="section" style="padding-top:118px;max-width:1180px">
      <div class="eyebrow">Timeline · 时间线全景</div>
      <h2 class="font-serif-zh" style="font-size:clamp(28px,4vw,44px);line-height:1.15">从侘寂到赛博朋克 · 跨越七个世纪的设计语言</h2>
      <p style="color:var(--muted);margin-top:10px;max-width:46ch">本系列时间跨度极大（14 世纪 → 当代），下方按等距排列以避免早期挤作一团。可切换为按「对秩序的态度」聚类。</p>
      <div style="display:flex;gap:10px;margin:28px 0 8px">
        <button class="tl-tab chip" data-mode="chrono" onclick="setTimelineView('chrono')">时间排序</button>
        <button class="tl-tab chip" data-mode="order" onclick="setTimelineView('order')">按「对秩序的态度」聚类</button>
      </div>
      <div id="tl-body"></div>
    </div>`;
  setTimelineView('chrono');
}
function setTimelineView(mode){
  const body = document.getElementById('tl-body');
  document.querySelectorAll('.tl-tab').forEach(b=>{
    const on = b.dataset.mode===mode;
    b.style.borderColor = on ? 'var(--gold)' : 'var(--line)';
    b.style.color = on ? 'var(--gold)' : 'var(--ink)';
  });
  if(mode==='chrono'){
    body.innerHTML = `
      <div style="overflow-x:auto;padding:36px 0 10px">
        <div style="position:relative;display:flex;align-items:flex-start;min-width:max-content;padding:0 30px">
          <div style="position:absolute;left:30px;right:30px;top:120px;height:1px;background:var(--line);z-index:1"></div>
          ${STYLES.map(tlNode).join('')}
        </div>
      </div>`;
  } else {
    const groups = ORDER_ENUM.map(k=>({k, items:STYLES.filter(s=>s.comparison && s.comparison.orderStance===k)})).filter(g=>g.items.length);
    body.innerHTML = `
      <div class="grid gap-6" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:30px">
        ${groups.map(g=>`
          <div>
            <div class="eyebrow" style="margin-bottom:14px">${esc(g.k)}</div>
            <div style="display:flex;flex-direction:column;gap:14px">
              ${g.items.map(s=>`<a href="#/${s.id}" class="chip" style="justify-content:flex-start">
                <span class="font-serif-zh">${esc(s.nameZh)}</span>
                <span style="color:var(--muted);font-size:11px">${esc(s.period.label)}</span></a>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
  }
}

/* ============ 对比模式 · 五轴 face-off（PRD 3.3） ============ */
const CMP_AXES = [
  {key:'orderStance',    label:'对秩序的态度'},
  {key:'decorationStance',label:'对装饰的态度'},
  {key:'uiDifficulty',   label:'UI 应用难度'},
  {key:'coreEmotion',    label:'核心情绪'}
];
function cmpHead(s, side){
  const img = getCoverImage(s);
  const thumb = img
    ? `<img src="${esc(img)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover" onerror="this.style.opacity=0">`
    : `<div style="width:100%;height:100%;background:${phBG(s)}"></div>`;
  return `
    <div style="text-align:center">
      <div style="width:120px;height:120px;border-radius:8px;overflow:hidden;margin:0 auto 16px;box-shadow:0 12px 28px -12px rgba(0,0,0,.45)">${thumb}</div>
      <div class="font-serif-zh" style="font-size:24px;line-height:1.1">${esc(s.nameZh)}</div>
      <div class="font-serif-display" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px">${esc(s.name)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">${esc(s.region)} · ${esc(s.period.label)}</div>
    </div>`;
}
function paletteRow(pal){
  return `<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
    ${(pal||[]).map(c=>`<span title="${esc(c)}" style="width:26px;height:26px;border-radius:4px;background:${esc(c)};box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></span>`).join('')}</div>`;
}
function selectFor(side, sel, other){
  return `<select onchange="goCompare('${side}', this.value)"
      style="font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);max-width:160px">
    ${STYLES.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''} ${s.id===other?'disabled':''}>${esc(s.nameZh)}</option>`).join('')}
  </select>`;
}
function goCompare(side, id){
  const cur = (location.hash.replace(/^#\/?/, '').split('/'));
  let a = cur[1], b = cur[2];
  if(side==='a') a=id; else b=id;
  location.hash = `#/compare/${a||''}/${b||''}`;
}
const LAST_COMPARE_KEY = 'mdl:lastCompare';
function saveLastCompare(a, b){
  try{ localStorage.setItem(LAST_COMPARE_KEY, JSON.stringify({a, b})); }catch(e){}
}
function loadLastCompare(){
  try{ const v = JSON.parse(localStorage.getItem(LAST_COMPARE_KEY)||'null');
    return (v && v.a && v.b) ? v : null; }catch(e){ return null; }
}
function compareRandom(){
  const ids = STYLES.map(s=>s.id);
  const i = ids[Math.floor(Math.random()*ids.length)];
  let j; do{ j = ids[Math.floor(Math.random()*ids.length)]; }while(j===i);
  location.hash = `#/compare/${i}/${j}`;
}
function renderCompare(idA, idB){
  document.body.classList.remove('on-detail');
  document.title = '对比 · 设计语言博物馆';
  setAmbient(null, false);
  // 无参数访问 #/compare 时，先恢复上次本地记录的对比对，再回退到默认
  if(!idA && !idB){ const last = loadLastCompare(); if(last){ idA = last.a; idB = last.b; } }
  let a = byId[idA], b = byId[idB];
  if(!a || a.status!=='published') a = byId['bauhaus'] || STYLES[0];
  if(!b || b.status!=='published' || b.id===a.id) b = byId['memphis-design'] && byId['memphis-design'].id!==a.id ? byId['memphis-design'] : STYLES.find(s=>s.id!==a.id);
  // 记录本次对比对到本地，下次自动恢复
  saveLastCompare(a.id, b.id);

  const ca = a.comparison||{}, cb = b.comparison||{};
  const axisRow = (ax) => {
    const va = ca[ax.key]||'—', vb = cb[ax.key]||'—';
    const same = va!=='—' && va===vb;
    const tag = same
      ? `<span style="font-size:10px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 8px">态度相同</span>`
      : `<span style="font-size:10px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px">相异</span>`;
    return `<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 0;border-top:1px solid var(--line)">
      <div style="text-align:right;font-size:clamp(15px,2vw,19px)${same?';color:var(--gold)':''}">${esc(va)}</div>

// themeColor 占位渐变背景（封面图缺失或加载失败时使用）
function phBG(s){
  const tc = s.themeColor || '#999';
  return `radial-gradient(circle at 30% 25%, color-mix(in srgb, ${tc} 78%, ${isLight(tc)?'#fff':'#000'}), ${tc})`;
}
// 占位卡内容（流派名 + 提示）
function phInner(s, tag){
  const fg = isLight(s.themeColor) ? 'rgba(42,38,34,.9)' : 'rgba(245,242,236,.95)';
  return `<div class="card-ph" style="color:${fg}">
      <div class="ph-zh">${esc(s.nameZh)}</div>
      <div class="ph-en">${esc(s.name)}</div>
      ${tag ? `<div class="ph-tag">${esc(tag)}</div>` : ''}
    </div>`;
}
// 图片加载失败 → 原地降级为 themeColor 占位（封面图 URL 失效/版权撤下时不破版）
function museumImgFail(img, id){
  const s = byId[id]; if(!s) { img.style.display='none'; return; }
  const fig = img.closest('figure');
  if(fig){ // 代表作画廊：整图换占位块
    fig.querySelector('img').outerHTML =
      `<div class="w-full h-72 flex items-center justify-center rounded" style="background:${phBG(s)}">${phInner(s,'')}</div>`;
    return;
  }
  const host = img.closest('.card-art') || img.closest('.hero-bg');
  if(host){ host.style.background = phBG(s); host.innerHTML = phInner(s, host.classList.contains('card-art') ? '图片加载失败 · 占位' : ''); }
}

function cardArtHTML(s){
  const img = getCoverImage(s);
  if(img){
    return `<div class="card-art"><img loading="lazy" src="${esc(img)}" alt="${esc(s.name)}" onerror="museumImgFail(this,'${s.id}')"></div>`;
  }
  return `<div class="card-art" style="background:${phBG(s)};">${phInner(s,'图片待补 · themeColor')}</div>`;
}

function initCarousel(){
  const stage = document.getElementById('stage');
  const cards = [...document.querySelectorAll('.card')];
  const dots  = [...document.querySelectorAll('#dots button')];
  const caption = document.getElementById('caption');
  const n = GALLERY.length;

  // 触屏 OR 窄屏：中央卡常显文字（无 hover 时移动端也能看到信息）
  const setTouch = ()=> stage.classList.toggle('touch',
    window.matchMedia('(hover: none)').matches || window.innerWidth <= 820);
  setTouch();

  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPACING = 200, EXTRA = 60, DEPTH = 170, ANGLE = 52, DRAG_DIV = 230;
  let pos = 0, vel = 0, animTarget = null, dragging = false, lastFocus = -1;

  const clamp = v => Math.max(0, Math.min(n-1, v));

  function render(){
    const center = Math.round(pos);
    cards.forEach((card,i)=>{
      const o = i - pos, ao = Math.abs(o), sign = Math.sign(o), cl = Math.min(ao,1);
      const x = o*SPACING + sign*EXTRA*cl;
      const z = -Math.min(ao,3)*DEPTH;
      const rot = -sign*cl*ANGLE;
      const scale = Math.max(1 - ao*0.12, 0.55);
      card.style.transform =
        `translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg) scale(${scale})`;
      card.style.opacity = Math.max(1 - ao*0.30, 0.12);
      card.style.zIndex = 200 - Math.round(ao*10);
      card.classList.toggle('is-center', i===center && ao < 0.5);
    });
  }

  function updateFocus(){
    const f = clamp(Math.round(pos));
    if(f === lastFocus) return;
    lastFocus = f;
    const s = GALLERY[f];
    setAmbient(s.themeColor, s.isDark);
    dots.forEach((d,i)=> d.classList.toggle('on', i===f));
    caption.innerHTML =
      `<div class="sc-kicker">${esc(s.region)} · ${esc(s.period.label)}</div>
       <div class="sc-title">${esc(s.name)}</div>`;
  }

  function frame(){
    if(!dragging){
      if(REDUCE){
        // 尊重 reduced-motion：无惯性/缓动，直接吸附到目标/最近卡
        if(animTarget !== null){ pos = animTarget; animTarget = null; }
        else { pos = clamp(Math.round(pos)); vel = 0; }
      } else if(animTarget !== null){
        pos += (animTarget - pos)*0.16;
        if(Math.abs(animTarget - pos) < 0.001){ pos = animTarget; animTarget = null; }
      } else {
        pos += vel; vel *= 0.90;
        if(Math.abs(vel) < 0.004){
          vel = 0;
          const t = clamp(Math.round(pos));
          pos += (t - pos)*0.16;
          if(Math.abs(t - pos) < 0.001) pos = t;
        }
      }
      pos = clamp(pos);
    }
    render(); updateFocus();
    requestAnimationFrame(frame);
  }

  // wheel
  stage.addEventListener('wheel', e=>{
    e.preventDefault(); animTarget = null;
    if(REDUCE){ animTarget = clamp(Math.round(pos) + ((e.deltaY+e.deltaX) > 0 ? 1 : -1)); return; }
    vel += (e.deltaY + e.deltaX) * 0.0009;
    vel = Math.max(-0.6, Math.min(0.6, vel));
  }, {passive:false});

  // drag (pointer)
  let startX=0, startPos=0, moved=false;
  stage.addEventListener('pointerdown', e=>{
    dragging = true; moved = false; animTarget = null; vel = 0;
    startX = e.clientX; startPos = pos;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 4) moved = true;
    const np = clamp(startPos - dx/DRAG_DIV);
    vel = np - pos; pos = np;
  });
  function endDrag(){ dragging = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // click card: center -> detail; side -> bring to center
  cards.forEach(card=>{
    card.addEventListener('click', e=>{
      if(moved) return;
      const i = +card.dataset.i;
      if(i === Math.round(pos)){ location.hash = '#/' + card.dataset.id; }
      else { animTarget = i; vel = 0; }
    });
  });

  // dots
  dots.forEach(d=> d.addEventListener('click', ()=>{ animTarget = +d.dataset.i; vel = 0; }));

  // keys：← → 转动，Enter / Space 打开中央卡
  if(window._carKey) document.removeEventListener('keydown', window._carKey);
  function onKey(e){
    if(document.body.classList.contains('on-detail')) return;
    if(e.key === 'ArrowRight'){ animTarget = clamp(Math.round(pos)+1); vel=0; }
    else if(e.key === 'ArrowLeft'){ animTarget = clamp(Math.round(pos)-1); vel=0; }
    else if(e.key === 'Enter' || e.key === ' '){
      const c = GALLERY[clamp(Math.round(pos))];
      if(c){ e.preventDefault(); location.hash = '#/' + c.id; }
    }
  }
  window._carKey = onKey;
  document.addEventListener('keydown', onKey);

  // resize：旋转 / 改窗宽时重新判定触屏聚焦
  if(window._carResize) window.removeEventListener('resize', window._carResize);
  window._carResize = setTouch;
  window.addEventListener('resize', setTouch);

  frame();
}

/* 导航滚动态：详情页滚过 hero 后转 paper 底+深色字 */
function navScroll(){
  const nav = document.querySelector('.nav');
  if(!nav) return;
  if(!document.body.classList.contains('on-detail')){ nav.classList.remove('nav-solid'); return; }
  const hero = document.querySelector('.detail-hero');
  const past = hero ? window.scrollY > hero.offsetHeight - 80 : window.scrollY > 200;
  nav.classList.toggle('nav-solid', past);
}
